name: GPT Code Review

on:
  pull_request:
    types:
      - opened
    branches:
      - dev

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Groq API key
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY is not configured."
            exit 1
          fi
          echo "Groq API key is configured."

      - name: Set scan timestamp
        shell: bash
        run: |
          echo "SCAN_TIMESTAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_ENV"

      - name: Get PR diff and changed files
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          git diff "origin/${BASE_REF}...HEAD" > pr.diff
          head -c 60000 pr.diff > pr_trimmed.diff
          git diff --name-only "origin/${BASE_REF}...HEAD" > changed_files.txt
          echo "===== Changed files ====="
          cat changed_files.txt
          echo "===== Diff size (bytes) ====="
          wc -c < pr.diff

      - name: Run GPT Code Review
        id: run_review
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node .github/scripts/review.js

      - name: Verify review file
        shell: bash
        run: |
          if [ ! -s "claude-review.md" ]; then
            echo "ERROR: claude-review.md was not created or is empty."
            exit 1
          fi
          cat claude-review.md

      - name: Post review as PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file claude-review.md

      - name: Convert review to HTML
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCAN_TIMESTAMP: ${{ env.SCAN_TIMESTAMP }}
        run: node .github/scripts/convert-html.js

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: gpt-review-report-pr${{ github.event.pull_request.number }}-${{ env.SCAN_TIMESTAMP }}
          path: claude-review.html
          retention-days: 30

      - name: Check if gh-pages branch exists
        id: check_gh_pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/branches/gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing gh-pages history
        if: steps.check_gh_pages.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-existing

      - name: Assemble Pages publish folder
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCAN_TIMESTAMP: ${{ env.SCAN_TIMESTAMP }}
        run: |
          mkdir -p pages-publish
          if [ -d "gh-pages-existing" ]; then
            cp -r gh-pages-existing/* pages-publish/ 2>/dev/null || true
          fi
          mkdir -p "pages-publish/reviews/pr${PR_NUMBER}/${SCAN_TIMESTAMP}"
          cp claude-review.html "pages-publish/reviews/pr${PR_NUMBER}/${SCAN_TIMESTAMP}/index.html"

      - name: Build scan history index
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DIR: pages-publish/reviews/pr${{ github.event.pull_request.number }}
        run: node .github/scripts/build-index.js

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-publish
          publish_branch: gh-pages
          keep_files: false

      - name: Print report URL
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCAN_TIMESTAMP: ${{ env.SCAN_TIMESTAMP }}
        run: |
          echo "This scan: https://${{ github.repository_owner }}.github.io/simple-node-js-react-npm-app/reviews/pr${PR_NUMBER}/${SCAN_TIMESTAMP}/"
          echo "Full history: https://${{ github.repository_owner }}.github.io/simple-node-js-react-npm-app/reviews/pr${PR_NUMBER}/"

      - name: Gate PR on review status
        shell: bash
        run: |
          if [ "${{ steps.run_review.outputs.review_status }}" = "FAIL" ]; then
            echo "❌ Review found Critical/High issues or Medium+ risk. Blocking merge."
            exit 1
          else
            echo "✅ Review passed. PR can be merged."
          fi
