name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================
      # 2. Check environment
      # ============================================
      - name: Check environment
        shell: bash
        run: |
          echo "====================================="
          echo "Runner Environment"
          echo "====================================="

          echo "Operating System:"
          uname -a

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "Current Directory:"
          pwd

          echo ""
          echo "Repository Files:"
          ls -la

      # ============================================
      # 3. Check Anthropic API Key
      # ============================================
      - name: Check Anthropic API key
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Checking Anthropic API key..."

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY is not configured."
            exit 1
          fi

          echo "SUCCESS: ANTHROPIC_API_KEY is configured."

      # ============================================
      # 4. Run Claude Code Review
      # ============================================
      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}

        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

          prompt: |
            You are a senior software engineer performing a
            code review for this GitHub Pull Request.

            Repository:
            ${{ github.repository }}

            Pull Request:
            #${{ github.event.pull_request.number }}

            Application:
            - Node.js
            - React
            - npm

            Review the complete Pull Request.

            Focus on:

            1. Code quality
            2. Bugs
            3. Runtime errors
            4. Security vulnerabilities
            5. npm dependency risks
            6. React best practices
            7. Node.js best practices
            8. Test coverage
            9. Performance
            10. Maintainability
            11. Error handling
            12. Input validation
            13. Authentication and authorization
            14. Secrets and sensitive information
            15. Configuration problems

            IMPORTANT:

            You MUST create a file named:

            claude-review.md

            in the repository root.

            The review MUST use this format:

            # Claude Code Review

            ## Strengths

            List the positive aspects of the Pull Request.

            ## Issues Found

            Use exactly this table:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|

            Severity must be one of:

            Critical
            High
            Medium
            Low

            Include the file path and line number whenever possible.

            If no issues are found:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|
            | None | - | - | No issues found |

            ## Risk Level

            Choose:

            Low
            Medium
            High
            Critical

            Explain the risk level.

            ## Recommendation

            Clearly state:

            APPROVED

            or

            CHANGES REQUESTED

            Explain what needs to be fixed before merging.

            IMPORTANT:

            1. Analyze the Pull Request.
            2. Create claude-review.md.
            3. Read claude-review.md.
            4. Post the same content as a Pull Request comment.
            5. Do NOT skip file creation.
            6. Do NOT create an empty review.

          claude_args: |
            --max-turns 20
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Read,Write"

      # ============================================
      # 5. Verify review
      # ============================================
      - name: Verify Claude review
        shell: bash
        run: |
          echo "====================================="
          echo "Checking Claude Review"
          echo "====================================="

          if [ -f "claude-review.md" ]; then

            echo "SUCCESS: claude-review.md exists."

            echo ""
            echo "========== CLAUDE REVIEW =========="

            cat claude-review.md

            echo ""
            echo "====================================="

          else

            echo "ERROR: claude-review.md was not created."

            echo ""
            echo "Current directory:"
            pwd

            echo ""
            echo "Files:"
            ls -la

            exit 1

          fi

      # ============================================
      # 6. Convert Markdown to HTML
      # ============================================
      - name: Convert review to HTML
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'

          const fs = require('fs');

          const markdown =
            fs.readFileSync('claude-review.md', 'utf8');

          function escapeHtml(text) {
            return text
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#039;');
          }

          const lines = markdown.split(/\r?\n/);

          let html = '';
          let inTable = false;
          let firstTableRow = true;

          for (const line of lines) {

            if (line.startsWith('# ')) {
              html += `<h1>${escapeHtml(line.substring(2))}</h1>\n`;
              continue;
            }

            if (line.startsWith('## ')) {
              html += `<h2>${escapeHtml(line.substring(3))}</h2>\n`;
              continue;
            }

            if (line.startsWith('### ')) {
              html += `<h3>${escapeHtml(line.substring(4))}</h3>\n`;
              continue;
            }

            if (line.trim().startsWith('|')) {

              const trimmed = line.trim();

              const content =
                trimmed.substring(
                  1,
                  trimmed.length - 1
                );

              const cells =
                content.split('|')
                  .map(cell => cell.trim());

              const separator =
                cells.every(cell =>
                  /^:?-+:?$/.test(cell)
                );

              if (separator) {
                continue;
              }

              if (!inTable) {
                html += '<table>\n';
                inTable = true;
                firstTableRow = true;
              }

              const tag =
                firstTableRow ? 'th' : 'td';

              html += '<tr>';

              for (const cell of cells) {
                html +=
                  `<${tag}>${escapeHtml(cell)}</${tag}>`;
              }

              html += '</tr>\n';

              firstTableRow = false;

              continue;
            }

            if (inTable) {
              html += '</table>\n';
              inTable = false;
              firstTableRow = true;
            }

            if (line.trim() === '') {
              html += '<br>\n';
              continue;
            }

            html +=
              `<p>${escapeHtml(line)}</p>\n`;
          }

          if (inTable) {
            html += '</table>\n';
          }

          const page = `
          <!DOCTYPE html>
          <html>

          <head>

          <meta charset="UTF-8">

          <title>
          Claude PR Review - PR #${process.env.PR_NUMBER}
          </title>

          <style>

          body {
            font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;

            max-width: 1100px;
            margin: 40px auto;
            padding: 0 25px;

            line-height: 1.6;
            color: #24292f;
            background: #ffffff;
          }

          h1 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
          }

          h2 {
            margin-top: 35px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
          }

          table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
          }

          th {
            background-color: #f6f8fa;
            font-weight: 600;
          }

          th,
          td {
            border: 1px solid #d0d7de;
            padding: 10px;
            text-align: left;
            vertical-align: top;
          }

          tr:nth-child(even) {
            background-color: #f9f9f9;
          }

          p {
            margin: 10px 0;
          }

          </style>

          </head>

          <body>

          ${html}

          </body>

          </html>
          `;

          fs.writeFileSync(
            'claude-review.html',
            page
          );

          console.log(
            'SUCCESS: claude-review.html created.'
          );

          NODE

      # ============================================
      # 7. Upload HTML report
      # ============================================
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
