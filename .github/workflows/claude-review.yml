name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for a Node.js/React application.

            Focus on:
            - Code quality
            - Bugs and potential runtime issues
            - Security vulnerabilities
            - npm dependency risks
            - Test coverage
            - React best practices
            - Node.js best practices
            - Performance issues

            Point out both strengths and weaknesses.

            You MUST do the following:

            1. Review the complete pull request.
            2. Create a file named claude-review.md in the repository root.
            3. The file must contain:

            # Claude Code Review

            ## Strengths

            List positive aspects of the changes.

            ## Issues Found

            Use this exact markdown table format:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|

            Add all issues found to the table.

            ## Risk Level

            State Low, Medium, High, or Critical and explain why.

            ## Recommendation

            Provide a clear recommendation about whether the PR is ready
            to merge or requires changes.

            4. After creating claude-review.md, post its complete contents
            as a comment on the pull request.

            Do not skip the file creation step.

          claude_args: |
            --model claude-sonnet-4-5
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(cat:*),Bash(pwd:*),Bash(ls:*),Bash(touch:*),Bash(echo:*)"
            --max-turns 20

      - name: Check review file exists
        shell: bash
        run: |
          echo "Checking for claude-review.md..."

          if [ -f claude-review.md ]; then
            echo "claude-review.md found."
            echo "--------------------------------"
            cat claude-review.md
            echo "--------------------------------"
            wc -l claude-review.md
          else
            echo "ERROR: claude-review.md was not created."
            echo "Claude Code Action failed to create the review."
            exit 1
          fi

      - name: Convert review to HTML
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const md = fs.readFileSync('claude-review.md', 'utf8');

          const esc = s =>
            s.replace(/&/g, '&amp;')
             .replace(/</g, '&lt;')
             .replace(/>/g, '&gt;');

          const lines = md.split('\n');
          let html = '';
          let inTable = false;
          let tableHeader = true;

          for (const line of lines) {

            if (line.startsWith('### ')) {
              html += '<h3>' + esc(line.slice(4)) + '</h3>\n';
              continue;
            }

            if (line.startsWith('## ')) {
              html += '<h2>' + esc(line.slice(3)) + '</h2>\n';
              continue;
            }

            if (line.startsWith('# ')) {
              html += '<h1>' + esc(line.slice(2)) + '</h1>\n';
              continue;
            }

            if (line.trim().startsWith('|')) {

              const cells = line
                .trim()
                .slice(1, -1)
                .split('|')
                .map(c => c.trim());

              if (cells.every(c => /^:?-+:?$/.test(c))) {
                continue;
              }

              if (!inTable) {
                html += '<table>\n';
                inTable = true;
                tableHeader = true;
              }

              const tag = tableHeader ? 'th' : 'td';

              html += '<tr>' +
                cells.map(c =>
                  `<${tag}>${esc(c)}</${tag}>`
                ).join('') +
                '</tr>\n';

              tableHeader = false;
              continue;
            }

            if (inTable) {
              html += '</table>\n';
              inTable = false;
              tableHeader = true;
            }

            if (line.trim() === '') {
              html += '<br>\n';
              continue;
            }

            html += '<p>' + esc(line) + '</p>\n';
          }

          if (inTable) {
            html += '</table>\n';
          }

          const page = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Claude PR Review - PR #${process.env.PR_NUMBER}</title>

            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                  Arial, sans-serif;
                max-width: 1000px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
                color: #24292f;
              }

              table {
                border-collapse: collapse;
                width: 100%;
                margin: 20px 0;
              }

              th, td {
                border: 1px solid #d0d7de;
                padding: 10px;
                text-align: left;
              }

              th {
                background: #f6f8fa;
              }

              h1, h2, h3 {
                margin-top: 30px;
              }
            </style>
          </head>

          <body>
            ${html}
          </body>
          </html>
          `;

          fs.writeFileSync('claude-review.html', page);
          NODE

        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
