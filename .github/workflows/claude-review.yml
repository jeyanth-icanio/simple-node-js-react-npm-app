name: GPT Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify OpenAI API key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY is not configured."
            echo "Go to: Repository Settings -> Secrets and variables -> Actions"
            echo "Create a secret named OPENAI_API_KEY"
            exit 1
          fi
          echo "OpenAI API key is configured."

      - name: Run GPT Code Review
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # 1. Get the PR diff (capped to avoid huge payloads)
          gh pr diff "$PR_NUMBER" > pr.diff
          head -c 60000 pr.diff > pr_trimmed.diff

          # 2. Build the review request and call OpenAI
          node <<'NODE'
          const fs = require('fs');

          async function main() {
            const diff = fs.readFileSync('pr_trimmed.diff', 'utf8');

            const systemPrompt = `You are a senior software engineer reviewing a GitHub Pull Request for a Node.js and React application.
Check: code quality, bugs, security vulnerabilities, npm dependency risks, React best practices, Node.js best practices, test coverage, performance, error handling, input validation, authentication/authorization, secrets or sensitive info, maintainability, configuration problems.

Respond ONLY in this exact markdown format, nothing else:

# Claude Review

## Strengths
(list strengths)

## Issues Found
| Severity | File | Line | Issue |
|----------|------|------|-------|
(one row per issue; if none, use: | None | - | - | No issues found |)

## Risk Level
(Low / Medium / High / Critical, with one line explanation)

## Recommendation
(APPROVED or CHANGES REQUESTED, with reason)`;

            const res = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: 'gpt-5.1',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: `Here is the PR diff:\n\n${diff}` }
                ],
                temperature: 0.2
              })
            });

            const data = await res.json();

            if (!res.ok) {
              console.error('OpenAI API error:', JSON.stringify(data));
              process.exit(1);
            }

            const review = data.choices[0].message.content;
            fs.writeFileSync('claude-review.md', review);
            console.log('SUCCESS: claude-review.md written.');
          }

          main();
          NODE

      - name: Verify review file
        shell: bash
        run: |
          if [ ! -s "claude-review.md" ]; then
            echo "ERROR: claude-review.md was not created or is empty."
            exit 1
          fi
          echo "=========================================="
          cat claude-review.md
          echo "=========================================="

      - name: Post review as PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file claude-review.md

      - name: Convert review to HTML
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const md = fs.readFileSync("claude-review.md", "utf8");

          function escapeHtml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          const lines = md.split(/\r?\n/);
          let html = "";
          let inTable = false;
          let headerProcessed = false;

          for (const line of lines) {
            if (line.startsWith("# ")) {
              if (inTable) { html += "</table>\n"; inTable = false; }
              html += "<h1>" + escapeHtml(line.substring(2)) + "</h1>\n";
              continue;
            }
            if (line.startsWith("## ")) {
              if (inTable) { html += "</table>\n"; inTable = false; }
              html += "<h2>" + escapeHtml(line.substring(3)) + "</h2>\n";
              continue;
            }
            if (line.startsWith("### ")) {
              if (inTable) { html += "</table>\n"; inTable = false; }
              html += "<h3>" + escapeHtml(line.substring(4)) + "</h3>\n";
              continue;
            }
            if (line.trim().startsWith("|")) {
              const trimmed = line.trim();
              const content = trimmed.substring(1, trimmed.length - 1);
              const cells = content.split("|").map(c => c.trim());
              const separator = cells.every(c => /^:?-+:?$/.test(c));
              if (separator) continue;
              if (!inTable) { html += "<table>\n"; inTable = true; headerProcessed = false; }
              const tag = headerProcessed ? "td" : "th";
              html += "<tr>";
              for (const cell of cells) html += `<${tag}>${escapeHtml(cell)}</${tag}>`;
              html += "</tr>\n";
              headerProcessed = true;
              continue;
            }
            if (inTable) { html += "</table>\n"; inTable = false; headerProcessed = false; }
            if (line.trim() === "") { html += "<br>\n"; continue; }
            html += "<p>" + escapeHtml(line) + "</p>\n";
          }
          if (inTable) html += "</table>\n";

          const htmlPage = `<!DOCTYPE html><html><head><meta charset="UTF-8">
          <title>GPT PR Review - PR #${process.env.PR_NUMBER}</title>
          <style>
          body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 25px;line-height:1.6;color:#24292f;background:#fff}
          h1{border-bottom:2px solid #ddd;padding-bottom:10px}
          h2{margin-top:35px;border-bottom:1px solid #ddd;padding-bottom:5px}
          table{width:100%;border-collapse:collapse;margin:20px 0}
          th{background-color:#f6f8fa;font-weight:600}
          th,td{border:1px solid #d0d7de;padding:10px;text-align:left;vertical-align:top}
          tr:nth-child(even){background-color:#f9f9f9}
          p{margin:10px 0}
          </style></head><body>${html}</body></html>`;

          fs.writeFileSync("claude-review.html", htmlPage);
          console.log("SUCCESS: claude-review.html created.");
          NODE

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: gpt-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
