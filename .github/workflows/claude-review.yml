name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================
      # 2. Verify environment
      # ============================================
      - name: Verify environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Claude Code Review Environment"
          echo "=========================================="

          echo "OS:"
          uname -a

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Git:"
          git --version

          echo ""
          echo "GitHub CLI:"
          gh --version

          echo ""
          echo "Working directory:"
          pwd

      # ============================================
      # 3. Verify Anthropic API key exists
      # ============================================
      - name: Verify Anthropic API key
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ERROR: ANTHROPIC_API_KEY is not configured."
            echo ""
            echo "Go to:"
            echo "Repository Settings"
            echo "  -> Secrets and variables"
            echo "  -> Actions"
            echo ""
            echo "Create/update:"
            echo "ANTHROPIC_API_KEY"
            exit 1
          fi

          echo "Anthropic API key is configured."
          echo "The key value will not be displayed."

      # ============================================
      # 4. Run Claude Code Review
      # ============================================
      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1

        env:
          GH_TOKEN: ${{ github.token }}

        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}

          # Keep enabled while troubleshooting.
          show_full_output: true

          prompt: |
            You are a senior software engineer reviewing a GitHub Pull Request.

            Repository:
            ${{ github.repository }}

            Pull Request:
            #${{ github.event.pull_request.number }}

            Review the Pull Request changes for a Node.js and React application.

            Check the following:

            1. Code quality
            2. Bugs
            3. Security vulnerabilities
            4. npm dependency risks
            5. React best practices
            6. Node.js best practices
            7. Test coverage
            8. Performance
            9. Error handling
            10. Input validation
            11. Authentication and authorization
            12. Secrets or sensitive information
            13. Maintainability
            14. Configuration problems

            REQUIRED:

            Create this file in the repository root:

            claude-review.md

            The file must contain:

            # Claude Code Review

            ## Strengths

            List the strengths of the Pull Request.

            ## Issues Found

            Use this exact table format:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|

            Use one of these severities:

            Critical
            High
            Medium
            Low

            Include file path and line number whenever possible.

            If no issues are found, use:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|
            | None | - | - | No issues found |

            ## Risk Level

            Select:

            Low
            Medium
            High
            Critical

            Explain the risk level.

            ## Recommendation

            Clearly state either:

            APPROVED

            or:

            CHANGES REQUESTED

            Explain the reason.

            REQUIRED ORDER:

            1. Analyze the Pull Request.
            2. Create claude-review.md.
            3. Read claude-review.md.
            4. Post the exact same content to the Pull Request as a comment.

            Do not skip the file creation.

          claude_args: |
            --max-turns 20
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Read,Write"

      # ============================================
      # 5. Verify review file
      # ============================================
      - name: Verify review file
        shell: bash
        run: |
          echo "=========================================="
          echo "Checking claude-review.md"
          echo "=========================================="

          if [ ! -f "claude-review.md" ]; then
            echo "ERROR: claude-review.md was not created."
            echo ""
            echo "Claude Code did not complete successfully."
            echo ""
            echo "Check the Claude Code step above."
            exit 1
          fi

          if [ ! -s "claude-review.md" ]; then
            echo "ERROR: claude-review.md is empty."
            exit 1
          fi

          echo "SUCCESS: claude-review.md exists."
          echo ""

          echo "=========================================="
          echo "CLAUDE REVIEW"
          echo "=========================================="

          cat claude-review.md

          echo ""
          echo "=========================================="

      # ============================================
      # 6. Convert Markdown to HTML
      # ============================================
      - name: Convert review to HTML
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'

          const fs = require("fs");

          const md = fs.readFileSync(
            "claude-review.md",
            "utf8"
          );

          function escapeHtml(value) {
            return value
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
          }

          const lines = md.split(/\r?\n/);

          let html = "";
          let inTable = false;
          let headerProcessed = false;

          for (const line of lines) {

            if (line.startsWith("# ")) {

              if (inTable) {
                html += "</table>\n";
                inTable = false;
              }

              html +=
                "<h1>" +
                escapeHtml(line.substring(2)) +
                "</h1>\n";

              continue;
            }

            if (line.startsWith("## ")) {

              if (inTable) {
                html += "</table>\n";
                inTable = false;
              }

              html +=
                "<h2>" +
                escapeHtml(line.substring(3)) +
                "</h2>\n";

              continue;
            }

            if (line.startsWith("### ")) {

              if (inTable) {
                html += "</table>\n";
                inTable = false;
              }

              html +=
                "<h3>" +
                escapeHtml(line.substring(4)) +
                "</h3>\n";

              continue;
            }

            if (line.trim().startsWith("|")) {

              const trimmed = line.trim();

              const content = trimmed.substring(
                1,
                trimmed.length - 1
              );

              const cells = content
                .split("|")
                .map(cell => cell.trim());

              const separator = cells.every(
                cell => /^:?-+:?$/.test(cell)
              );

              if (separator) {
                continue;
              }

              if (!inTable) {
                html += "<table>\n";
                inTable = true;
                headerProcessed = false;
              }

              const tag =
                headerProcessed ? "td" : "th";

              html += "<tr>";

              for (const cell of cells) {
                html +=
                  `<${tag}>${escapeHtml(cell)}</${tag}>`;
              }

              html += "</tr>\n";

              headerProcessed = true;

              continue;
            }

            if (inTable) {
              html += "</table>\n";
              inTable = false;
              headerProcessed = false;
            }

            if (line.trim() === "") {
              html += "<br>\n";
              continue;
            }

            html +=
              "<p>" +
              escapeHtml(line) +
              "</p>\n";
          }

          if (inTable) {
            html += "</table>\n";
          }

          const htmlPage = `
          <!DOCTYPE html>
          <html>
          <head>

          <meta charset="UTF-8">

          <title>
          Claude PR Review - PR #${process.env.PR_NUMBER}
          </title>

          <style>

          body {
            font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;

            max-width: 1100px;

            margin: 40px auto;

            padding: 0 25px;

            line-height: 1.6;

            color: #24292f;

            background: #ffffff;
          }

          h1 {
            border-bottom:
              2px solid #ddd;

            padding-bottom: 10px;
          }

          h2 {
            margin-top: 35px;

            border-bottom:
              1px solid #ddd;

            padding-bottom: 5px;
          }

          table {
            width: 100%;

            border-collapse:
              collapse;

            margin: 20px 0;
          }

          th {
            background-color:
              #f6f8fa;

            font-weight: 600;
          }

          th,
          td {
            border:
              1px solid #d0d7de;

            padding: 10px;

            text-align: left;

            vertical-align: top;
          }

          tr:nth-child(even) {
            background-color:
              #f9f9f9;
          }

          p {
            margin: 10px 0;
          }

          </style>

          </head>

          <body>

          ${html}

          </body>
          </html>
          `;

          fs.writeFileSync(
            "claude-review.html",
            htmlPage
          );

          console.log(
            "SUCCESS: claude-review.html created."
          );

          NODE

      # ============================================
      # 7. Upload HTML report
      # ============================================
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
