name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - dev

jobs:
  review:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for a Node.js/React app.
            Focus on: code quality, bugs, security issues (especially
            npm dependency risks), test coverage, and React/Node best
            practices. Point out strengths as well as weaknesses.

            1. Post your findings as a PR comment using the GitHub
               comment tool, ending with: Strengths / Issues Found /
               Risk Level / Recommendation.
            2. Also write the full review to a file named
               claude-review.md in the repo root, in the same format,
               with Issues Found as a markdown table
               (Severity | File | Line | Issue).
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Write"
            --max-turns 8

      - name: Convert review to HTML
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const md = fs.readFileSync('claude-review.md', 'utf8');
          const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const lines = md.split('\n');
          let html = '';
          let inTable = false;
          for (const line of lines) {
            if (line.startsWith('### ')) { html += '<h3>' + esc(line.slice(4)) + '</h3>\n'; continue; }
            if (line.startsWith('## '))  { html += '<h2>' + esc(line.slice(3)) + '</h2>\n'; continue; }
            if (line.startsWith('# '))   { html += '<h1>' + esc(line.slice(2)) + '</h1>\n'; continue; }
            if (line.trim().startsWith('|')) {
              const cells = line.trim().slice(1,-1).split('|').map(c => c.trim());
              if (cells.every(c => /^-+$/.test(c))) continue;
              const tag = inTable ? 'td' : 'th';
              if (!inTable) { html += '<table>\n'; inTable = true; }
              html += '<tr>' + cells.map(c => '<' + tag + '>' + esc(c) + '</' + tag + '>').join('') + '</tr>\n';
              continue;
            } else if (inTable) { html += '</table>\n'; inTable = false; }
            if (line.trim() === '') { html += '<br>\n'; continue; }
            html += '<p>' + esc(line) + '</p>\n';
          }
          if (inTable) html += '</table>\n';
          const page = '<!DOCTYPE html><html><head><meta charset=\"utf-8\">' +
            '<title>Claude PR Review - PR #${{ github.event.pull_request.number }}</title>' +
            '<style>body{font-family:-apple-system,Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.6}' +
            'table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:left}' +
            'th{background:#f4f4f4}code{background:#f4f4f4;padding:2px 6px;border-radius:4px}</style></head><body>' +
            html + '</body></html>';
          fs.writeFileSync('claude-review.html', page);
          "

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
