name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - dev

jobs:
  review:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:

      # ============================================
      # 1. Checkout repository
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================
      # 2. Check runner
      # ============================================
      - name: Check runner environment
        shell: pwsh
        run: |
          Write-Host "====================================="
          Write-Host "Runner Environment"
          Write-Host "====================================="

          Write-Host "Operating System:"
          $env:OS

          Write-Host ""
          Write-Host "Node:"
          node --version

          Write-Host ""
          Write-Host "NPM:"
          npm --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "GitHub CLI:"
          gh --version

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

      # ============================================
      # 3. Claude Code Review
      # ============================================
      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1

        env:
          GH_TOKEN: ${{ github.token }}

        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          github_token: ${{ github.token }}

          prompt: |
            You are a senior software engineer performing a
            code review for this GitHub Pull Request.

            Repository:
            ${{ github.repository }}

            Pull Request:
            #${{ github.event.pull_request.number }}

            Review the complete Pull Request.

            The application uses:
            - Node.js
            - React
            - npm

            Review the following areas:

            1. Code quality
            2. Bugs
            3. Runtime errors
            4. Security vulnerabilities
            5. npm dependency risks
            6. React best practices
            7. Node.js best practices
            8. Test coverage
            9. Performance
            10. Maintainability
            11. Error handling
            12. Input validation
            13. Authentication and authorization
            14. Secrets or sensitive information
            15. Configuration problems

            IMPORTANT:

            You MUST create a file called:

            claude-review.md

            in the repository root.

            The review file MUST use this format:

            # Claude Code Review

            ## Strengths

            List the positive aspects of this Pull Request.

            ## Issues Found

            Use EXACTLY this table format:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|

            Severity must be:

            Critical
            High
            Medium
            Low

            Include the file path and line number whenever possible.

            If no issues are found, write:

            | Severity | File | Line | Issue |
            |----------|------|------|-------|
            | None | - | - | No issues found |

            ## Risk Level

            Choose:

            Low
            Medium
            High
            Critical

            Explain the risk.

            ## Recommendation

            Clearly state:

            APPROVED

            or

            CHANGES REQUESTED

            Explain what needs to be done before merging.

            IMPORTANT:

            1. First analyze the Pull Request.
            2. Create claude-review.md.
            3. Read claude-review.md.
            4. Post the contents of claude-review.md as a comment
               on the Pull Request.
            5. Do NOT skip the file creation.
            6. Do NOT create an empty review.
            7. Do NOT claim the review was completed unless
               claude-review.md actually exists.

          claude_args: |
            --max-turns 20
            --permission-mode bypassPermissions
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Read,Write"

      # ============================================
      # 4. Verify Claude output
      # ============================================
      - name: Verify Claude review
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "====================================="
          Write-Host "Checking Claude Review"
          Write-Host "====================================="

          if (Test-Path "claude-review.md") {

              Write-Host ""
              Write-Host "SUCCESS"
              Write-Host "claude-review.md was created."

              Write-Host ""
              Write-Host "File details:"
              Get-Item "claude-review.md" |
                Select-Object Name, Length, FullName

              Write-Host ""
              Write-Host "====================================="
              Write-Host "Claude Review Content"
              Write-Host "====================================="

              Get-Content "claude-review.md"

              Write-Host ""
              Write-Host "====================================="

          }
          else {

              Write-Host ""
              Write-Host "ERROR"
              Write-Host "claude-review.md was NOT created."

              Write-Host ""
              Write-Host "Current directory:"
              Get-Location

              Write-Host ""
              Write-Host "Repository files:"
              Get-ChildItem -Force

              Write-Host ""
              Write-Host "Searching entire workspace:"
              Get-ChildItem `
                -Path $env:GITHUB_WORKSPACE `
                -Filter "claude-review.md" `
                -Recurse `
                -ErrorAction SilentlyContinue

              Write-Error `
                "Claude Code did not create claude-review.md."
          }

      # ============================================
      # 5. Convert Markdown to HTML
      # ============================================
      - name: Convert review to HTML
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |

          $markdown = Get-Content `
            "claude-review.md" `
            -Raw

          function Escape-Html($text) {
              $text = $text -replace '&', '&amp;'
              $text = $text -replace '<', '&lt;'
              $text = $text -replace '>', '&gt;'
              $text = $text -replace '"', '&quot;'
              return $text
          }

          $lines = $markdown -split "`r?`n"

          $html = ""
          $inTable = $false
          $firstTableRow = $true

          foreach ($line in $lines) {

              if ($line.StartsWith("### ")) {

                  $content = Escape-Html($line.Substring(4))

                  $html += "<h3>$content</h3>`n"

                  continue
              }

              if ($line.StartsWith("## ")) {

                  $content = Escape-Html($line.Substring(3))

                  $html += "<h2>$content</h2>`n"

                  continue
              }

              if ($line.StartsWith("# ")) {

                  $content = Escape-Html($line.Substring(2))

                  $html += "<h1>$content</h1>`n"

                  continue
              }

              if ($line.Trim().StartsWith("|")) {

                  $trimmed = $line.Trim()

                  $trimmed = $trimmed.Substring(
                    1,
                    $trimmed.Length - 2
                  )

                  $cells = $trimmed.Split("|")

                  $isSeparator = $true

                  foreach ($cell in $cells) {

                      $cleanCell = $cell.Trim()

                      if ($cleanCell -notmatch "^:?-+:?$") {
                          $isSeparator = $false
                          break
                      }
                  }

                  if ($isSeparator) {
                      continue
                  }

                  if (-not $inTable) {

                      $html += "<table>`n"

                      $inTable = $true

                      $firstTableRow = $true
                  }

                  if ($firstTableRow) {
                      $tag = "th"
                  }
                  else {
                      $tag = "td"
                  }

                  $html += "<tr>"

                  foreach ($cell in $cells) {

                      $content = Escape-Html(
                        $cell.Trim()
                      )

                      $html += "<$tag>$content</$tag>"
                  }

                  $html += "</tr>`n"

                  $firstTableRow = $false

                  continue
              }

              if ($inTable) {

                  $html += "</table>`n"

                  $inTable = $false

                  $firstTableRow = $true
              }

              if ([string]::IsNullOrWhiteSpace($line)) {

                  $html += "<br>`n"

                  continue
              }

              $content = Escape-Html($line)

              $html += "<p>$content</p>`n"
          }

          if ($inTable) {
              $html += "</table>`n"
          }

          $page = @"
          <!DOCTYPE html>

          <html>

          <head>

          <meta charset="UTF-8">

          <title>
          Claude PR Review - PR #$env:PR_NUMBER
          </title>

          <style>

          body {
              font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;

              max-width: 1100px;

              margin: 40px auto;

              padding: 0 25px;

              line-height: 1.6;

              color: #24292f;

              background: #ffffff;
          }

          h1 {
              border-bottom:
              2px solid #ddd;

              padding-bottom: 10px;
          }

          h2 {
              margin-top: 35px;

              border-bottom:
              1px solid #ddd;

              padding-bottom: 5px;
          }

          table {
              width: 100%;

              border-collapse:
              collapse;

              margin: 20px 0;
          }

          th {
              background-color:
              #f6f8fa;

              font-weight: 600;
          }

          th,
          td {
              border:
              1px solid #d0d7de;

              padding: 10px;

              text-align: left;

              vertical-align: top;
          }

          tr:nth-child(even) {
              background-color:
              #f9f9f9;
          }

          p {
              margin: 10px 0;
          }

          </style>

          </head>

          <body>

          $html

          </body>

          </html>
          "@

          Set-Content `
            -Path "claude-review.html" `
            -Value $page `
            -Encoding UTF8

          Write-Host ""
          Write-Host "HTML report created successfully."

      # ============================================
      # 6. Upload HTML report
      # ============================================
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-report-pr${{ github.event.pull_request.number }}
          path: claude-review.html
          retention-days: 30
